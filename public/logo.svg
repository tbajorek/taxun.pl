<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 56" role="img" aria-label="Taxun - biuro rachunkowe">
  <defs>
    <linearGradient id="taxunMarkBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#11244A"/>
      <stop offset="100%" stop-color="#0A1A35"/>
    </linearGradient>
    <linearGradient id="taxunMarkTick" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>
  <!-- Mark -->
  <g>
    <rect x="2" y="4" width="48" height="48" rx="13" fill="url(#taxunMarkBg)"/>
    <!-- Subtle inner highlight -->
    <rect x="2.5" y="4.5" width="47" height="47" rx="12.5" fill="none" stroke="rgba(255,255,255,0.06)"/>
    <!-- Letter T -->
    <path d="M13 18 H39 V23 H29 V42 H23 V23 H13 Z" fill="#ffffff"/>
    <!-- Rising growth tick (accent) -->
    <path d="M30 30 L35 25 L40 30 L45 22" stroke="url(#taxunMarkTick)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="45" cy="22" r="2.2" fill="#34D399"/>
  </g>
  <!-- Wordmark -->
  <g font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700">
    <text x="62" y="32" font-size="22" fill="#0A1A35" letter-spacing="-0.5">taxun</text>
    <text x="62" y="46" font-size="9" fill="#64748B" letter-spacing="2.4" font-weight="600">BIURO RACHUNKOWE</text>
  </g>
</svg>
