<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="og-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A1A35"/>
      <stop offset="100%" stop-color="#06112A"/>
    </linearGradient>
    <radialGradient id="og-glow" cx="0.85" cy="0.15" r="0.6">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#og-bg)"/>
  <rect width="1200" height="630" fill="url(#og-glow)"/>

  <!--
    Znak wstawia `scripts/build-brand.mjs` w miejsce tego komentarza - wycina go
    z `logo.png` i wkleja jako `<image>` zakodowany w base64. Rysowany ręcznie
    wychodził trochę inny niż logo (inna grubość strzałki, inny promień rogów),
    a obrazek w mediach społecznościowych ma pokazywać dokładnie ten sam znak
    co nagłówek serwisu.
  -->
  <!--MARK-->

  <text x="80" y="340" font-family="'Plus Jakarta Sans', sans-serif" font-size="76" font-weight="800" fill="#ffffff" letter-spacing="-2">Profesjonalna księgowość</text>
  <text x="80" y="420" font-family="'Plus Jakarta Sans', sans-serif" font-size="76" font-weight="800" fill="#34D399" letter-spacing="-2">bez stresu i błędów</text>

  <text x="80" y="490" font-family="Inter, sans-serif" font-size="28" font-weight="500" fill="#94A3B8">Księgowość · Kadry i płace · Konsultacje podatkowe</text>

  <g transform="translate(80, 540)" font-family="Inter, sans-serif" font-size="22" font-weight="600" fill="#E2E8F0">
    <circle cx="6" cy="-6" r="6" fill="#10B981"/>
    <text x="22" y="0">taxun.pl</text>
  </g>
</svg>
